
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d35">
  <title>打字練習｜Eden-Keys</title>
  <link rel="stylesheet" href="css/practice.css">
</head>

<body>
  <main class="practice-card">
    <p class="brand">EDEN-KEYS</p>
    <h1>森林鍵位練習</h1>

    <p class="description">
      先找到鍵盤上的定位鍵，<br>
      慢慢來，讓手指熟悉自己的位置。
    </p>

    <p class="progress" id="progress">
      準備開始你的第一次練習
    </p>

    <div class="target" id="target">F</div>

    <p class="hint" id="hint" aria-live="polite">
      找到鍵盤上的 F 鍵，準備好了就開始吧！
    </p>

    <!-- 完整虛擬鍵盤 -->
    <div class="keyboard-full" id="keyboard"
         aria-label="QWERTY 虛擬鍵盤">

      <div class="keyboard-row">
        <button class="keyboard-key" data-key="Q">Q</button>
        <button class="keyboard-key" data-key="W">W</button>
        <button class="keyboard-key" data-key="E">E</button>
        <button class="keyboard-key" data-key="R">R</button>
        <button class="keyboard-key" data-key="T">T</button>
        <button class="keyboard-key" data-key="Y">Y</button>
        <button class="keyboard-key" data-key="U">U</button>
        <button class="keyboard-key" data-key="I">I</button>
        <button class="keyboard-key" data-key="O">O</button>
        <button class="keyboard-key" data-key="P">P</button>
      </div>

      <div class="keyboard-row">
        <button class="keyboard-key" data-key="A">A</button>
        <button class="keyboard-key" data-key="S">S</button>
        <button class="keyboard-key" data-key="D">D</button>
        <button class="keyboard-key" data-key="F">F</button>
        <button class="keyboard-key" data-key="G">G</button>
        <button class="keyboard-key" data-key="H">H</button>
        <button class="keyboard-key" data-key="J">J</button>
        <button class="keyboard-key" data-key="K">K</button>
        <button class="keyboard-key" data-key="L">L</button>
      </div>

      <div class="keyboard-row">
        <button class="keyboard-key" data-key="Z">Z</button>
        <button class="keyboard-key" data-key="X">X</button>
        <button class="keyboard-key" data-key="C">C</button>
        <button class="keyboard-key" data-key="V">V</button>
        <button class="keyboard-key" data-key="B">B</button>
        <button class="keyboard-key" data-key="N">N</button>
        <button class="keyboard-key" data-key="M">M</button>
      </div>
    </div>

    <!-- 手指提示與答題回饋，各保留一份 -->
    <div class="finger-guide" id="finger-guide">
      開始練習後，這裡會提示你使用哪隻手與哪根手指。
    </div>

    <p class="practice-feedback" id="practice-feedback"
       aria-live="polite"></p>

    <div class="button-row">
      <button id="start-button">開始練習</button>

      <button id="restart-button" class="secondary" hidden>
        再練一次
      </button>
    </div>

    <div class="stats" id="stats" aria-live="polite">
      準備好後開始練習，熟悉主列按鍵。
    </div>

        <a class="back-link" href="index.html">
      ← 回到 Eden-Keys 首頁
    </a>
  </main>

  <!-- 收藏獎勵視窗：預設隱藏，通關時才顯示 -->
  <div
    class="reward-overlay"
    id="reward-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reward-title"
    aria-describedby="reward-description"
    hidden
  >
    <section class="reward-modal">

      <button
        class="reward-close"
        id="reward-close"
        type="button"
        aria-label="關閉收藏獎勵視窗"
      >
        ×
      </button>

      <p class="reward-eyebrow">EDEN-KEYS · COLLECTION</p>

      <h2 id="reward-title">獲得新收藏！</h2>

      <div class="reward-divider"></div>

      <div class="reward-content">

        <div class="reward-art-frame">
          <img
            class="reward-art"
            id="reward-art"
            src="images/forest-jade.png"
            alt="森林翡翠收藏道具"
          >
        </div>

        <div class="reward-details">
          <h3 id="reward-name">森林翡翠</h3>

          <p class="reward-level" id="reward-level">
            第一關｜森林初探
          </p>

          <p
            class="reward-description"
            id="reward-description"
          >
            蘊含森林能量的古老翡翠，據說是森林守護者的祝福。
          </p>
        </div>

      </div>

      <button
        class="reward-claim"
        id="reward-claim"
        type="button"
      >
        收下碎片
      </button>

    </section>
  </div>

<script src="js/collection.js"></script>
<script src="js/game.js"></script>

</body>
</html>
