<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173d35">
  <title>打字練習｜Eden-Keys</title>

<link rel="stylesheet" href="css/practice.css">
</head>

<body>
  <main class="practice-card">
    <p class="brand">EDEN-KEYS</p>
    <h1>森林鍵位練習</h1>
    <p class="description">
      先找到鍵盤上的定位鍵，<br>
      慢慢來，讓手指熟悉自己的位置。
    </p>

    <p class="progress" id="progress">準備開始你的第一次練習</p>
    <div class="target" id="target">F</div>
    <p class="hint" id="hint" aria-live="polite">
      找到鍵盤上的 F 鍵，準備好了就開始吧！
    </p>

    <div class="keyboard" aria-label="虛擬鍵盤">
      <div class="key active" id="key-f">F</div>
      <div class="key" id="key-j">J</div>
    </div>

    <div class="button-row">
      <button id="start-button">開始練習</button>
      <button id="restart-button" class="secondary" hidden>
        再練一次
      </button>
    </div>

    <div class="stats" id="stats" aria-live="polite">
      完成 10 題，熟悉 F 與 J 定位鍵。
    </div>

    <a class="back-link" href="index.html">← 回到 Eden-Keys 首頁</a>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
